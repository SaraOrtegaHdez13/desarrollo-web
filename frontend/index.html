<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | LuzioTeamTime</title>
    <script src="js/acceso.js" defer></script>
</head>
<body data-pagina="login">
<main>
    <h1>Iniciar sesión</h1>

    <form id="formulario-acceso">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
            autocomplete="current-password" required>

    <button type="submit">Entrar</button>
    </form>

    <p id="mensaje" role="status"></p>
    <a href="registro.html">Crear una cuenta</a>
</main>
</body>
</html>
