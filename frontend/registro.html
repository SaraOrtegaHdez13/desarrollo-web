<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | LuzioTeamTime</title>
  <script src="js/acceso.js" defer></script>
</head>
<body data-pagina="registro">
  <main>
    <h1>Crear una cuenta</h1>

    <form id="formulario-acceso">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" autocomplete="name" required>

      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" required>

      <button type="submit">Registrarme</button>
    </form>

    <p id="mensaje" role="status"></p>
    <a href="index.html">Volver al inicio de sesión</a>
  </main>
</body>
</html>

<script src="js/acceso.js" defer></script>
