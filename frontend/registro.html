<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — LuzioTeamTime</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body data-pagina="registro">
  <div class="auth-wrapper">
    <main class="card auth-card">
      <header class="auth-heading">
        <div class="auth-brand">
          <span class="brand-uv-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
          <span>LuzioTeamTime</span>
        </div>
        <h1 class="page-title">Crear cuenta</h1>
        <p class="page-subtitle">Crea tu cuenta académica para colaborar en equipos y tableros.</p>
      </header>

      <nav class="auth-tabs" aria-label="Modo de acceso">
        <a href="index.html" class="btn btn-ghost">
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <polyline points="10 17 15 12 10 7" />
            <line x1="15" y1="12" x2="3" y2="12" />
          </svg>
          <span>Iniciar sesión</span>
        </a>
        <a href="registro.html" class="btn btn-primary" aria-current="page">
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
          <span>Crear cuenta</span>
        </a>
      </nav>

      <div id="mensaje" class="banner banner-info" role="status" aria-live="polite"></div>

      <form id="formulario-acceso" method="post">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" class="form-control" type="text" autocomplete="name" required placeholder="Ej. Alicia Ríos" />
        </div>

        <div class="form-group">
          <label class="form-label" for="correo">Correo electrónico</label>
          <input id="correo" name="correo" class="form-control" type="email" autocomplete="email" required placeholder="nombre@estudiantes.uv.mx" />
        </div>

        <div class="form-group">
          <label class="form-label" for="contrasena">Contraseña</label>
          <input id="contrasena" name="password" class="form-control" type="password" autocomplete="new-password" required placeholder="Mínimo 8 caracteres" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
          <span>Registrar cuenta</span>
        </button>
      </form>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/acceso.js"></script>
</body>
</html>
