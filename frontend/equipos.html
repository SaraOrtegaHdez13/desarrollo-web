<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis equipos — LuzioTeamTime</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Barra lateral compacta UV Nocturno -->
    <aside class="sidebar" aria-label="Navegación principal">
      <div>
        <a href="equipos.html" class="brand-header">
          <span class="brand-uv-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
          <span>LuzioTeamTime</span>
        </a>
        <div class="brand-subtag">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>Edición UV · Modo Nocturno</span>
        </div>

        <nav aria-label="Secciones de la aplicación">
          <ul class="nav-list">
            <li>
              <a href="equipos.html" class="nav-link is-active" aria-current="page">
                <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span>Mis equipos</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user-name">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span id="usuario-actual">Cargando usuario...</span>
        </div>
        <div class="sidebar-user-meta">Sesión académica activa</div>
        <button id="cerrar-sesion" type="button" disabled class="btn btn-ghost btn-sm btn-block">
          <svg class="icon-svg icon-svg-sm" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <!-- Área principal -->
    <main class="main-area">
      <header class="page-header">
        <div>
          <h1 class="page-title">
            <svg class="icon-svg icon-svg-lg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Mis equipos</span>
          </h1>
          <p id="sesion-equipo" class="page-subtitle">Cargando sesión…</p>
        </div>
        <button id="mostrar-creacion" type="button" class="btn btn-primary" aria-expanded="false" aria-controls="crear-equipo" disabled>＋ Crear equipo</button>
      </header>

      <div id="mensaje" class="banner banner-info" role="status" aria-live="polite"></div>

      <!-- Formulario de creación de equipo -->
      <section id="crear-equipo" hidden class="card" aria-labelledby="titulo-crear-equipo" style="margin-bottom: 26px;">
        <div class="card-header">
          <h2 id="titulo-crear-equipo" class="card-title">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>Crear nuevo equipo</span>
          </h2>
        </div>

        <form id="formulario-equipo" method="post">
          <div class="two-col-grid" style="gap: 16px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="nombre">Nombre del equipo</label>
              <input id="nombre" name="nombre" class="form-control" type="text" required placeholder="Ej. Proyecto LISTI" />
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="descripcion">Descripción (opcional)</label>
              <input id="descripcion" name="descripcion" class="form-control" type="text" placeholder="Objetivo o experiencia educativa del equipo" />
            </div>
          </div>

          <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
            <button type="submit" disabled class="btn btn-primary">
              <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              <span>Crear equipo</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Listado de equipos activos -->
      <section aria-labelledby="titulo-equipos-activos" style="margin-bottom: 28px;">
        <div class="card-header">
          <h2 id="titulo-equipos-activos" class="card-title">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            <span>Equipos activos</span>
          </h2>
        </div>
        <div id="equipos-activos" class="teams-grid"></div>
      </section>

      <!-- Listado de equipos archivados -->
      <section aria-labelledby="titulo-equipos-archivados">
        <div class="card-header">
          <h2 id="titulo-equipos-archivados" class="card-title">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="21 8 21 21 3 21 3 8" />
              <rect x="1" y="3" width="22" height="5" />
              <line x1="10" y1="12" x2="14" y2="12" />
            </svg>
            <span>Equipos archivados</span>
          </h2>
        </div>
        <div id="equipos-archivados" class="teams-grid"></div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/equipos.js"></script>
</body>
</html>
